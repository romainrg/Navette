name: Navette
options:
  bundleIdPrefix: io.github.romainrg
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    Release:
      ONLY_ACTIVE_ARCH: NO

packages:
  NavetteCore:
    path: NavetteCore

targets:
  Navette:
    type: application
    platform: macOS
    sources:
      - path: Navette
    dependencies:
      - package: NavetteCore
        product: NavetteCore
    info:
      path: Navette/Resources/Info.plist
      properties:
        CFBundleDisplayName: Navette
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Romain Gallien. MIT License."
    settings:
      base:
        PRODUCT_NAME: Navette
        PRODUCT_BUNDLE_IDENTIFIER: io.github.romainrg.Navette
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES

schemes:
  Navette:
    build:
      targets:
        Navette: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: NavetteCore/NavetteCoreTests
    archive:
      config: Release
