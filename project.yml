name: Navette
options:
  bundleIdPrefix: io.github.romainrg
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    Release:
      ONLY_ACTIVE_ARCH: NO

packages:
  NavetteCore:
    path: NavetteCore

targets:
  Navette:
    type: application
    platform: macOS
    sources:
      - path: Navette
    dependencies:
      - package: NavetteCore
        product: NavetteCore
      # The helper ssh runs to ask for passwords; it lives next to the app's executable.
      - target: NavetteAskpass
        embed: true
        link: false
        codeSign: true
        copy:
          destination: executables
    info:
      path: Navette/Resources/Info.plist
      properties:
        CFBundleDisplayName: Navette
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Romain Gallien. MIT License."
        NSLocalNetworkUsageDescription: "Navette connects to the servers you configure, including those on your local network."
        # WebDAV servers reached over plain http (NAS, local network). The app warns that they are not encrypted.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_NAME: Navette
        PRODUCT_BUNDLE_IDENTIFIER: io.github.romainrg.Navette
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES

  NavetteAskpass:
    type: tool
    platform: macOS
    sources:
      - path: Tools/Askpass
    settings:
      base:
        PRODUCT_NAME: navette-askpass
        PRODUCT_BUNDLE_IDENTIFIER: io.github.romainrg.Navette.askpass
        SKIP_INSTALL: YES

  # Development tool: renders the app views offscreen to PNG (scripts/screenshots.sh). Never distributed.
  NavetteScreenshots:
    type: application
    platform: macOS
    sources:
      - path: Navette
        excludes:
          - App/NavetteApp.swift
          - Resources/Info.plist
      - path: Tools/Screenshots
    dependencies:
      - package: NavetteCore
        product: NavetteCore
    settings:
      base:
        PRODUCT_NAME: NavetteScreenshots
        PRODUCT_BUNDLE_IDENTIFIER: io.github.romainrg.Navette.Screenshots
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        ENABLE_HARDENED_RUNTIME: NO

schemes:
  Navette:
    build:
      targets:
        Navette: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: NavetteCore/NavetteCoreTests
    archive:
      config: Release
  NavetteScreenshots:
    build:
      targets:
        NavetteScreenshots: all
    run:
      config: Debug
